[layer]
name = "workspace"

[provides]
agent_automation = "Automate notebook workflows: extract, summarize, transform, alert"
self_service_automation = "Agents create and manage their own automations without human intervention"
collaborative_notebook = "Shared workspace where agents and humans co-author, annotate, and reason"

[quilt]
role = "notebook-layer"
compat = "v0.6"
relationship = "notebookLM is the zoomed-in notebook surface; quilt is the reactive grid runtime. An automation built here can be projected onto a quilt cell (formula/listener/AI). See QUILT-COMPAT.md."
cell_mapping = "research→AI cell, transform→formula cell, fleet-ingest→listener cell, insights→value cell"
